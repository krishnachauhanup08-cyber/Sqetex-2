<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyChat</title>
  <meta property="og:site_name" content="Sqetex">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Sqetex",
  "alternateName": "sqetex.com",
  "url": "https://www.sqetex.com/"
}
</script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #dfe7ef;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: auto;
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 350px;
      border-right: 1px solid #ddd;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #229ed9;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
    }

    .search {
      margin: 0 15px 15px;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: #f1f3f5;
      outline: none;
      width: calc(100% - 30px);
      font-size: 15px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat {
      display: flex;
      padding: 13px 15px;
      cursor: pointer;
      gap: 12px;
    }

    .chat:hover {
      background: #f1f3f5;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .chat-name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #888;
    }

    .last-message {
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .chat-header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-weight: bold;
      font-size: 17px;
    }

    .status {
      color: #229ed9;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 70%;
      padding: 9px 12px;
      border-radius: 12px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .sent {
      background: #d9fdd3;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      margin-left: 8px;
      float: right;
      margin-top: 5px;
    }

    /* INPUT */
    .input-area {
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .attach {
      font-size: 23px;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      border: none;
      background: #f1f3f5;
      padding: 13px 16px;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .send {
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #168ac0;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .main {
        display: none;
      }

      .sidebar.mobile-chat-open {
        display: none;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">MyChat</div>
      <div class="menu">☰</div>
    </div>

    <input
      type="text"
      class="search"
      id="searchInput"
      placeholder="Search"
    >

    <div class="chat-list" id="chatList">

      <div class="chat">
        <div class="avatar">A</div>

        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">Alex</span>
            <span class="time">9:15 PM</span>
          </div>

          <div class="last-message">
            Hey! How are you?
          </div>
        </div>
      </div>

      <div class="chat">
        <div class="avatar">R</div>

        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">Rahul</span>
            <span class="time">8:40 PM</span>
          </div>

          <div class="last-message">
            See you tomorrow.
          </div>
        </div>
      </div>

      <div class="chat">
        <div class="avatar">S</div>

        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">Sam</span>
            <span class="time">7:20 PM</span>
          </div>

          <div class="last-message">
            Nice photo!
          </div>
        </div>
      </div>

    </div>
  </aside>


  <!-- MAIN CHAT -->
  <main class="main">

    <header class="chat-header">

      <div class="avatar">A</div>

      <div class="header-info">
        <div class="header-name">Alex</div>
        <div class="status">online</div>
      </div>

      <div>⋮</div>

    </header>


    <!-- MESSAGES -->
    <section class="messages" id="messages">

      <div class="message received">
        Hey! 👋
        <span class="message-time">9:10 PM</span>
      </div>

      <div class="message received">
        How are you?
        <span class="message-time">9:11 PM</span>
      </div>

      <div class="message sent">
        I'm good! What about you?
        <span class="message-time">9:12 PM</span>
      </div>

      <div class="message received">
        I'm great 😄
        <span class="message-time">9:13 PM</span>
      </div>

    </section>


    <!-- MESSAGE INPUT -->
    <div class="input-area">

      <label class="attach">
        📎
        <input
          type="file"
          id="fileInput"
          hidden
          accept="image/*"
        >
      </label>

      <input
        type="text"
        class="message-input"
        id="messageInput"
        placeholder="Write a message..."
      >

      <button class="send" id="sendButton">
        ➤
      </button>

    </div>

  </main>

</div>


<script>

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const messages =
    document.getElementById("messages");

  const searchInput =
    document.getElementById("searchInput");

  const chatList =
    document.getElementById("chatList");


  // SEND MESSAGE
  function sendMessage() {

    const text = messageInput.value.trim();

    if (text === "") {
      return;
    }

    const message =
      document.createElement("div");

    message.className = "message sent";

    const now =
      new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

    message.innerHTML =
      `${escapeHTML(text)}
      <span class="message-time">${now}</span>`;

    messages.appendChild(message);

    messageInput.value = "";

    messages.scrollTop =
      messages.scrollHeight;
  }


  // SEND BUTTON
  sendButton.addEventListener(
    "click",
    sendMessage
  );


  // ENTER TO SEND
  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  // SEARCH CHATS
  searchInput.addEventListener(
    "input",
    function() {

      const search =
        searchInput.value.toLowerCase();

      const chats =
        document.querySelectorAll(".chat");

      chats.forEach(chat => {

        const name =
          chat
          .querySelector(".chat-name")
          .textContent
          .toLowerCase();

        chat.style.display =
          name.includes(search)
          ? "flex"
          : "none";

      });

    }
  );


  // IMAGE SELECTION
  document
    .getElementById("fileInput")
    .addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          alert("Please select an image.");
          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          function(e) {

            const message =
              document.createElement("div");

            message.className =
              "message sent";

            message.innerHTML = `
              <img
                src="${e.target.result}"
                style="
                  max-width:220px;
                  border-radius:10px;
                  display:block;
                "
              >
              <span class="message-time">
                ${new Date().toLocaleTimeString([], {
                  hour:"2-digit",
                  minute:"2-digit"
                })}
              </span>
            `;

            messages.appendChild(message);

            messages.scrollTop =
              messages.scrollHeight;
          };

        reader.readAsDataURL(file);

      }
    );


  // SECURITY: prevent HTML injection
  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

</script>

</body>
</html>
