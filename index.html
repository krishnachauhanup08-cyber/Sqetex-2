    * {

    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: auto;
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 350px;
      border-right: 1px solid #ddd;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #229ed9;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
    }

    .search {
      margin: 0 15px 15px;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: #f1f3f5;
      outline: none;
      width: calc(100% - 30px);
      font-size: 15px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat {
      display: flex;
      padding: 13px 15px;
      cursor: pointer;
      gap: 12px;
    }

    .chat:hover {
      background: #f1f3f5;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .chat-name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #888;
    }

    .last-message {
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .chat-header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-weight: bold;
      font-size: 17px;
    }

    .status {
      color: #229ed9;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 70%;
      padding: 9px 12px;
      border-radius: 12px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .sent {
      background: #d9fdd3;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      margin-left: 8px;
      float: right;
      margin-top: 5px;
    }

    /* INPUT */
    .input-area {
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .attach {
      font-size: 23px;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      border: none;
      background: #f1f3f5;
      padding: 13px 16px;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .send {
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #168ac0;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .main {
        display: none;
      }

      .sidebar.mobile-chat-open {
        display: none;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

function goOffline() {
  if (!currentUser) return;
  updateDoc(doc(db, "users", currentUser.uid), {
    online: false,
    lastSeen: serverTimestamp(),
  }).catch(() => {});
}

function startPresence() {
  goOnline();
  if (presenceInterval) clearInterval(presenceInterval);
  presenceInterval = setInterval(() => {
    if (document.visibilityState === "visible") goOnline();
  }, 20000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") goOnline();
    else goOffline();
  });

  window.addEventListener("beforeunload", goOffline);
}
function validUsername(u) {
  return /^[a-z0-9._]{3,30}$/.test(u) && !u.includes("..") && !u.endsWith(".") && !u.startsWith(".");
}

 function resizeImage(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(
        img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size
      );
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById("photoInput").addEventListener("change", async (e) => {

    myProfile.photo = photo;

window.saveUsername = async function () {
  const username = document.getElementById("usernameInput").value.trim().toLowerCase();
  const name = document.getElementById("nameInput").value.trim() || username;
  const err = document.getElementById("setupError");
  err.innerText = "";

  if (!validUsername(username)) {
    err.innerText = "Username 3-30 akshar ka ho: a-z, 0-9, . ya _ (shuru/end mein . nahi)";
    return;
  }

  const unameRef = doc(db, "usernames", username);
  const userRef = doc(db, "users", currentUser.uid);
  try {
    await runTransaction(db, async (tx) => {
      const taken = await tx.get(unameRef);
      if (taken.exists()) throw new Error("Ye username pehle se kisi ne le rakha hai");
      tx.set(unameRef, { uid: currentUser.uid });
      tx.set(userRef, { username, name, bio: "", createdAt: serverTimestamp() });
    });
    await loadProfile(currentUser);
  } catch (e) {
    err.innerText = e.message;
  }
};

function timeAgo(ts) {
  if (!ts) return "";
  const d = ts.toDate();
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return "Kal";
  return d.toLocaleDateString([], { day: "2-digit", month: "short" });
}

let chatListUnsub = null;
let currentFriendUid = null;
let currentFriendProfile = null;

function loadChatList() {
  const q = query(
    collection(db, "userChats"),
    where("uid", "==", currentUser.uid),
    orderBy("lastMessageTime", "desc")
  );
  if (chatListUnsub) chatListUnsub();
  chatListUnsub = onSnapshot(q, (snapshot) => {
    const list = document.getElementById("chatList");
    list.innerHTML = "";
    snapshot.forEach((docSnap) => {
      const c = docSnap.data();
      const row = document.createElement("div");
      row.className = "chat-item";
      row.onclick = () =>
        openChat(c.otherUid, {
          username: c.otherUsername,
          name: c.otherName,
          photo: c.otherPhoto,
        });

      const avatar = document.createElement("div");
      avatar.className = "chat-item-avatar";
      if (c.otherPhoto) {
        avatar.style.backgroundImage = `url(${c.otherPhoto})`;
      } else {
        avatar.innerText = (c.otherName || c.otherUsername)[0].toUpperCase();
      }

      const info = document.createElement("div");
      info.className = "chat-item-info";
      const nameDiv = document.createElement("div");
      nameDiv.className = "chat-item-name";
      nameDiv.innerText = "@" + c.otherUsername;
      const lastDiv = document.createElement("div");
      lastDiv.className = "chat-item-last";
      lastDiv.innerText = c.lastMessage || "";
      info.appendChild(nameDiv);
      info.appendChild(lastDiv);

      const time = document.createElement("div");
      time.className = "chat-item-time";
      time.innerText = timeAgo(c.lastMessageTime);

      row.appendChild(avatar);
      row.appendChild(info);
      row.appendChild(time);
      list.appendChild(row);
    });
  });
}

window.openChat = function (friendUid, friendProfile) {
  currentFriendUid = friendUid;
  currentFriendProfile = friendProfile;
  const ids = [currentUser.uid, friendUid].sort();
  currentChatId = ids.join("_");

  document.getElementById("chatListScreen").style.display = "none";
  document.getElementById("chatScreen").style.display = "flex";
  document.getElementById("chName").innerText = "@" + friendProfile.username;

  const chAv = document.getElementById("chAvatar");
  if (friendProfile.photo) {
    chAv.innerText = "";
    chAv.style.backgroundImage = `url(${friendProfile.photo})`;
  } else {
    chAv.style.backgroundImage = "none";
    chAv.innerText = (friendProfile.name || friendProfile.username)[0].toUpperCase();
  }

  document.getElementById("messagesBox").innerHTML = "";
  if (unsubscribeMessages) unsubscribeMessages();

  const messagesRef = collection(db, "chats", currentChatId, "messages");
  const q = query(messagesRef, orderBy("createdAt"));
  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    const box = document.getElementById("messagesBox");
    box.innerHTML = "";
    snapshot.forEach((d) => {
      const msg = d.data();
      const row = document.createElement("div");
      row.className = "msg-row " + (msg.sender === currentUser.uid ? "mine" : "theirs");
      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";
      bubble.innerText = msg.text;
      row.appendChild(bubble);
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
  });
};

window.backToList = function () {
  if (unsubscribeMessages) unsubscribeMessages();
  document.getElementById("chatScreen").style.display = "none";
  document.getElementById("chatListScreen").style.display = "block";
};

window.startNewChat = async function () {
  const uname = prompt("Dost ka username daalo:");
  if (!uname) return;
  const clean = uname.trim().toLowerCase().replace(/^@/, "");
  if (!clean) return;
  if (clean === myProfile.username) return alert("Apna hi username mat daalo");

  const snap = await getDoc(doc(db, "usernames", clean));
  if (!snap.exists()) return alert("Ye username nahi mila");
  const friendUid = snap.data().uid;

  const friendSnap = await getDoc(doc(db, "users", friendUid));
  if (!friendSnap.exists()) return alert("Dost ki profile nahi mili");

  openChat(friendUid, friendSnap.data());
};
window.sendMessage = async function () {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !currentChatId || !currentFriendUid) return;

  const messagesRef = collection(db, "chats", currentChatId, "messages");
  await addDoc(messagesRef, {
    text: text,
    sender: currentUser.uid,
    createdAt: serverTimestamp(),
  });

  await setDoc(
    doc(db, "userChats", currentChatId + "_" + currentUser.uid),
    {
      uid: currentUser.uid,
      otherUid: currentFriendUid,
      otherUsername: currentFriendProfile.username,
      otherName: currentFriendProfile.name || "",
      otherPhoto: currentFriendProfile.photo || "",
      lastMessage: text,
      lastMessageTime: serverTimestamp(),
    },
    { merge: true }
  );

  await setDoc(
    doc(db, "userChats", currentChatId + "_" + currentFriendUid),
    {
      uid: currentFriendUid,
      otherUid: currentUser.uid,
      otherUsername: myProfile.username,
      otherName: myProfile.name || "",
      otherPhoto: myProfile.photo || "",
      lastMessage: text,
      lastMessageTime: serverTimestamp(),
    },
    { merge: true }
  );

  input.value = "";
};
