<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyChat</title>
  <meta property="og:site_name" content="Sqetex">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Sqetex",
  "alternateName": "sqetex.com",
  "url": "https://www.sqetex.com/"
}
</script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #dfe7ef;
      height: 100vh;

    }

    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: auto;
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 350px;
      border-right: 1px solid #ddd;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #229ed9;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
    }

    .search {
      margin: 0 15px 15px;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: #f1f3f5;
      outline: none;
      width: calc(100% - 30px);
      font-size: 15px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat {
      display: flex;
      padding: 13px 15px;
      cursor: pointer;
      gap: 12px;
    }

    .chat:hover {
      background: #f1f3f5;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .chat-name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #888;
    }

    .last-message {
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .chat-header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-weight: bold;
      font-size: 17px;
    }

    .status {
      color: #229ed9;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 70%;
      padding: 9px 12px;
      border-radius: 12px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .sent {
      background: #d9fdd3;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      margin-left: 8px;
      float: right;
      margin-top: 5px;
    }

    /* INPUT */
    .input-area {
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .attach {
      font-size: 23px;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      border: none;
      background: #f1f3f5;
      padding: 13px 16px;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .send {
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #168ac0;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .main {
        display: none;
      }

      .sidebar.mobile-chat-open {
        display: none;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

<script>

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const messages =
    document.getElementById("messages");

  const searchInput =
    document.getElementById("searchInput");

  const chatList =
    document.getElementById("chatList");


  // SEND MESSAGE
  function sendMessage() {

    const text = messageInput.value.trim();

    if (text === "") {
      return;
    }

    const message =
      document.createElement("div");

    message.className = "message sent";

    const now =
      new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

    message.innerHTML =
      `${escapeHTML(text)}
      <span class="message-time">${now}</span>`;

    messages.appendChild(message);

    messageInput.value = "";

    messages.scrollTop =
      messages.scrollHeight;
  }


  // SEND BUTTON
  sendButton.addEventListener(
    "click",
    sendMessage
  );


  // ENTER TO SEND
  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );


  // SEARCH CHATS
  searchInput.addEventListener(
    "input",
    function() {

      const search =
        searchInput.value.toLowerCase();

      const chats =
        document.querySelectorAll(".chat");

      chats.forEach(chat => {

        const name =
          chat
          .querySelector(".chat-name")
          .textContent
          .toLowerCase();

        chat.style.display =
          name.includes(search)
          ? "flex"
          : "none";

      });

    }
  );


  // IMAGE SELECTION
  document
    .getElementById("fileInput")
    .addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          alert("Please select an image.");
          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          function(e) {

            const message =
              document.createElement("div");

            message.className =
              "message sent";

            message.innerHTML = `
              <img
                src="${e.target.result}"
                style="
                  max-width:220px;
                  border-radius:10px;
                  display:block;
                "
              >
              <span class="message-time">
                ${new Date().toLocaleTimeString([], {
                  hour:"2-digit",
                  minute:"2-digit"
                })}
              </span>
            `;

            messages.appendChild(message);

            messages.scrollTop =
              messages.scrollHeight;
          };

        reader.readAsDataURL(file);

      }
    );


  // SECURITY: prevent HTML injection 
  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

</script>
 <div id="authBox" style="padding:15px;background:#f4f4f4;">
  <h3>Login / Signup</h3>
  <input type="email" id="email" placeholder="Email" style="display:block;margin:5px 0;padding:8px;width:90%;" />
  <input type="password" id="password" placeholder="Password" style="display:block;margin:5px 0;padding:8px;width:90%;" />
  <button onclick="signup()">Signup</button>
  <button onclick="login()">Login</button>
  <p id="status"></p>
</div>

<div id="chatApp" style="display:none;padding:15px;background:#eef3f7;">
  <p>Aapki User ID (dosto ko do): <b id="myUid"></b></p>
  <button onclick="logout()">Logout</button>
  <hr/>
  <h3>Chat karo</h3>
  <input type="text" id="friendUid" placeholder="Dost ki User ID daalo" style="padding:8px;width:70%;" />
  <button onclick="startChat()">Chat Start Karo</button>

  <div id="chatWindow" style="display:none;margin-top:15px;">
    <div id="messagesBox" style="border:1px solid #ccc;height:300px;overflow-y:auto;padding:10px;background:white;"></div>
    <input type="text" id="msgInput" placeholder="Message likho" style="padding:8px;width:70%;margin-top:5px;" />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAH1rat6w9-7kjMRLa3ZigXDAFK0eeo-PA",
    authDomain: "sqetex-ccc19.firebaseapp.com",
    projectId: "sqetex-ccc19",
    storageBucket: "sqetex-ccc19.firebasestorage.app",
    messagingSenderId: "733771927613",
    appId: "1:733771927613:web:a0449e9c2847884bf5da54"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentChatId = null;
  let unsubscribeMessages = null;

  window.signup = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    createUserWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        document.getElementById("status").innerText = "Error: " + error.message;
      });
  };

  window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    signInWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        document.getElementById("status").innerText = "Error: " + error.message;
      });
  };

  window.logout = function () {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById("authBox").style.display = "none";
      document.getElementById("chatApp").style.display = "block";
      document.getElementById("myUid").innerText = user.uid;
    } else {
      currentUser = null;
      document.getElementById("authBox").style.display = "block";
      document.getElementById("chatApp").style.display = "none";
      document.getElementById("chatWindow").style.display = "none";
    }
  });

  window.startChat = function () {
    const friendUid = document.getElementById("friendUid").value.trim();
    if (!friendUid) return alert("Friend ki User ID daalo");
    if (friendUid === currentUser.uid) return alert("Apni hi ID mat daalo");

    const ids = [currentUser.uid, friendUid].sort();
    currentChatId = ids.join("_");

    document.getElementById("chatWindow").style.display = "block";
    document.getElementById("messagesBox").innerHTML = "";

    if (unsubscribeMessages) unsubscribeMessages();

    const messagesRef = collection(db, "chats", currentChatId, "messages");
    const q = query(messagesRef, orderBy("createdAt"));

    unsubscribeMessages = onSnapshot(q, (snapshot) => {
      const box = document.getElementById("messagesBox");
      box.innerHTML = "";
      snapshot.forEach((doc) => {
        const msg = doc.data();
        const div = document.createElement("div");
        div.style.margin = "5px 0";
        div.style.textAlign = msg.sender === currentUser.uid ? "right" : "left";
        div.innerHTML = "<span style='background:" +
          (msg.sender === currentUser.uid ? "#daf1da" : "#eee") +
          ";padding:6px 10px;border-radius:8px;display:inline-block;'>" +
          msg.text + "</span>";
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    });
  };

  window.sendMessage = async function () {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !currentChatId) return;

    const messagesRef = collection(db, "chats", currentChatId, "messages");
    await addDoc(messagesRef, {
      text: text,
      sender: currentUser.uid,
      createdAt: serverTimestamp()
    });
    input.value = "";
  };
</script>
  

</body>
