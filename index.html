  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #dfe7ef;
      height: 100vh;

    }

    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: auto;
      background: white;
    }

    /* SIDEBAR */
    .sidebar {
      width: 350px;
      border-right: 1px solid #ddd;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #229ed9;
    }

    .menu {
      font-size: 24px;
      cursor: pointer;
    }

    .search {
      margin: 0 15px 15px;
      padding: 12px 15px;
      border-radius: 10px;
      border: none;
      background: #f1f3f5;
      outline: none;
      width: calc(100% - 30px);
      font-size: 15px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat {
      display: flex;
      padding: 13px 15px;
      cursor: pointer;
      gap: 12px;
    }

    .chat:hover {
      background: #f1f3f5;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .chat-name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #888;
    }

    .last-message {
      color: #777;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CHAT AREA */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5ddd5;
    }

    .chat-header {
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px;
      border-bottom: 1px solid #ddd;
    }

    .header-info {
      flex: 1;
    }

    .header-name {
      font-weight: bold;
      font-size: 17px;
    }

    .status {
      color: #229ed9;
      font-size: 13px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 70%;
      padding: 9px 12px;
      border-radius: 12px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      background: white;
      align-self: flex-start;
      border-bottom-left-radius: 3px;
    }

    .sent {
      background: #d9fdd3;
      align-self: flex-end;
      border-bottom-right-radius: 3px;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      margin-left: 8px;
      float: right;
      margin-top: 5px;
    }

    /* INPUT */
    .input-area {
      background: white;
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .attach {
      font-size: 23px;
      cursor: pointer;
    }

    .message-input {
      flex: 1;
      border: none;
      background: #f1f3f5;
      padding: 13px 16px;
      border-radius: 22px;
      outline: none;
      font-size: 15px;
    }

    .send {
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #229ed9;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .send:hover {
      background: #168ac0;
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
      }

      .main {
        display: none;
      }

      .sidebar.mobile-chat-open {
        display: none;
      }

      .message {
        max-width: 85%;
      }
    }
  </style>
</head>

}

}

<div id="chatApp" style="display:none;padding:15px;background:#eef3f7;">
 <div class="profile">
    <div class="p-ring"><div class="p-avatar" id="pAvatar" onclick="document.getElementById('photoInput').click()">?</div></div>
<input type="file" id="photoInput" accept="image/*" hidden>
    <div class="p-info">
      <div class="p-name" id="pName"></div>
<div class="p-username" id="pUsername"></div>
      <div class="p-bio" id="pBio"></div>

      <button onclick="editProfile()">Edit profile</button>
      <button onclick="removePhoto()">Photo hatao</button>
      <button onclick="logout()">Logout</button>

 </div> 
  <h3>Chat karo</h3>
  <input type="text" id="friendUid" placeholder="Dost ka @username daalo" style="padding:8px;width:70%;" />
  <button onclick="startChat()">Chat Start Karo</button>

  <div id="chatWindow" style="display:none;margin-top:15px;">
    <div id="messagesBox" style="border:1px solid #ccc;height:300px;overflow-y:auto;padding:10px;background:white;"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, getDoc, setDoc, updateDoc, runTransaction
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAH1rat6w9-7kjMRLa3ZigXDAFK0eeo-PA",
    authDomain: "sqetex-ccc19.firebaseapp.com",
    projectId: "sqetex-ccc19",
    storageBucket: "sqetex-ccc19.firebasestorage.app",
    messagingSenderId: "733771927613",
    appId: "1:733771927613:web:a0449e9c2847884bf5da54"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentChatId = null;
  let unsubscribeMessages = null;
let myProfile = null;

function validUsername(u) {
  return /^[a-z0-9._]{3,30}$/.test(u) && !u.includes("..") && !u.endsWith(".") && !u.startsWith(".");
}

function showProfile() {
  document.getElementById("pUsername").innerText = "@" + myProfile.username;
  document.getElementById("pName").innerText = myProfile.name || "";
  document.getElementById("pBio").innerText = myProfile.bio || "";
  const av = document.getElementById("pAvatar");
if (myProfile.photo) {
  av.style.backgroundImage = `url(${myProfile.photo})`;
  av.innerText = "";
} else {
  av.style.backgroundImage = "none";
  av.innerText = (myProfile.name || myProfile.username)[0].toUpperCase();
}
}
 function resizeImage(file, size = 200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(
        img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size
      );
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById("photoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const photo = await resizeImage(file);
    await updateDoc(doc(db, "users", currentUser.uid), { photo });
    myProfile.photo = photo;
    showProfile();
  } catch (err) {
    alert("Photo save nahi hui: " + err.message);
  }
  e.target.value = "";
});

window.removePhoto = async function () {
  await updateDoc(doc(db, "users", currentUser.uid), { photo: "" });
  myProfile.photo = "";
  showProfile();
}; 
async function loadProfile(user) {
  const snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists()) {
    document.getElementById("setupBox").style.display = "flex";
    return;
  }
  myProfile = snap.data();
  document.getElementById("setupBox").style.display = "none";
  showProfile();
}

window.saveUsername = async function () {
  const username = document.getElementById("usernameInput").value.trim().toLowerCase();
  const name = document.getElementById("nameInput").value.trim() || username;
  const err = document.getElementById("setupError");
  err.innerText = "";

  if (!validUsername(username)) {
    err.innerText = "Username 3-30 akshar ka ho: a-z, 0-9, . ya _ (shuru/end mein . nahi)";
    return;
  }

  const unameRef = doc(db, "usernames", username);
  const userRef = doc(db, "users", currentUser.uid);
  try {
    await runTransaction(db, async (tx) => {
      const taken = await tx.get(unameRef);
      if (taken.exists()) throw new Error("Ye username pehle se kisi ne le rakha hai");
      tx.set(unameRef, { uid: currentUser.uid });
      tx.set(userRef, { username, name, bio: "", createdAt: serverTimestamp() });
    });
    await loadProfile(currentUser);
  } catch (e) {
    err.innerText = e.message;
  }
};

window.editProfile = async function () {
  const name = prompt("Naam:", myProfile.name || "");
  if (name === null) return;
  const bio = prompt("Bio:", myProfile.bio || "");
  if (bio === null) return;
  await updateDoc(doc(db, "users", currentUser.uid), { name: name.trim(), bio: bio.trim() });
  myProfile.name = name.trim();
  myProfile.bio = bio.trim();
  showProfile();
};
  window.signup = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    createUserWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        document.getElementById("status").innerText = "Error: " + error.message;
      });
  };

  window.login = function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    signInWithEmailAndPassword(auth, email, password)
      .catch((error) => {
        document.getElementById("status").innerText = "Error: " + error.message;
      });
  };

  window.logout = function () {
    signOut(auth);
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById("authBox").style.display = "none";
      document.getElementById("chatApp").style.display = "block";
     loadProfile(user);
    } else {
      currentUser = null;
      document.getElementById("authBox").style.display = "block";
      document.getElementById("chatApp").style.display = "none";
      document.getElementById("chatWindow").style.display = "none";
    }
  });

  window.startChat = async function () {
  const uname = document.getElementById("friendUid").value.trim().toLowerCase().replace(/^@/, "");
  if (!uname) return alert("Dost ka username daalo");
  if (uname === myProfile.username) return alert("Apna hi username mat daalo");

  const snap = await getDoc(doc(db, "usernames", uname));
  if (!snap.exists()) return alert("Ye username nahi mila");
  const friendUid = snap.data().uid;

  const ids = [currentUser.uid, friendUid].sort();
  currentChatId = ids.join("_");

  document.getElementById("chatWindow").style.display = "block";
  document.getElementById("messagesBox").innerHTML = "";

  if (unsubscribeMessages) unsubscribeMessages();

  const messagesRef = collection(db, "chats", currentChatId, "messages");
  const q = query(messagesRef, orderBy("createdAt"));

  unsubscribeMessages = onSnapshot(q, (snapshot) => {
    const box = document.getElementById("messagesBox");
    box.innerHTML = "";
    snapshot.forEach((d) => {
      const msg = d.data();
      const div = document.createElement("div");
      div.style.margin = "5px 0";
      div.style.textAlign = msg.sender === currentUser.uid ? "right" : "left";
      const span = document.createElement("span");
      span.style.cssText =
        "background:" + (msg.sender === currentUser.uid ? "#daf1da" : "#eee") +
        ";padding:6px 10px;border-radius:8px;display:inline-block;";
      span.innerText = msg.text;
      div.appendChild(span);
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  });
};
  window.sendMessage = async function () {
    const input = document.getElementById("msgInput");
    const text = input.value.trim();
    if (!text || !currentChatId) return;

    const messagesRef = collection(db, "chats", currentChatId, "messages");
    await addDoc(messagesRef, {
      text: text,
      sender: currentUser.uid,
      createdAt: serverTimestamp()
    });
    input.value = "";
  };
</script>
 <div id="setupBox">
  <div class="card">
    <h2>Apna username chuno</h2>
    <p>Dost isse tumhe dhundhenge. Sirf a-z, 0-9, . aur _ (3 se 30 akshar).</p>
    <input id="usernameInput" placeholder="username" autocapitalize="none" autocomplete="off">
    <input id="nameInput" placeholder="Poora naam">
    <div id="setupError"></div>
    <button onclick="saveUsername()">Aage badho</button>
  </div>
 </div> 

</body>
